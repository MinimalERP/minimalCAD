<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>MinimalCAD drawing</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1e1e1e;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #view-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
      }
      #view-note {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        color: #e6e6e6;
        font-size: 16px;
        pointer-events: none;
      }
      #view-note[hidden] {
        display: none;
      }
      #view-fit {
        position: absolute;
        right: 12px;
        top: 12px;
        width: 44px;
        height: 44px;
        border: 1px solid #555;
        border-radius: 6px;
        background: rgba(40, 40, 40, 0.9);
        color: #e6e6e6;
        font-size: 22px;
      }
    </style>
  </head>
  <body>
    <canvas id="view-canvas"></canvas>
    <div id="view-note" role="status"></div>
    <button id="view-fit" title="Fit the drawing" aria-label="Fit the drawing">&#8962;</button>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>

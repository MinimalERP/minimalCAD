name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # MinimalERP's Supabase project: this site signs in with the MinimalERP account and reads its item master.
          # Both values are PUBLIC by design (the same two MinimalERP's own site is built with; row-level security and the
          # cad Edge Function are what protect the data) -- never put a service-role/secret key here or anywhere in src/.
          VITE_SUPABASE_URL: https://iifxhhnwhglhyxroqiqa.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpZnhoaG53aGdsaHl4cm9xaXFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMDEwMzUsImV4cCI6MjEwNTU3NzAzNX0.4tUuie0yXbUtwNTpWuU1o29veocI3amuEOAoljKQTn0
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

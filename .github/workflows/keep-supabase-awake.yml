name: Keep Supabase awake

# Supabase's free tier pauses a project after ~7 days without activity, which
# takes cloud login down ("Failed to fetch") until it's manually restored.
# A tiny read through the REST API every 3 days counts as activity. RLS
# scopes the query to auth.uid(), so with no signed-in user it returns an
# empty list -- it still hits the database, which is all that matters here.

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail-with-body -sS -m 30 \
            "$SUPABASE_URL/rest/v1/drawings?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY"

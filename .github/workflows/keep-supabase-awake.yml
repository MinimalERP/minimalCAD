name: Keep Supabase awake

# Supabase's free tier pauses a project after ~7 days without activity, which
# takes cloud login down ("Failed to fetch") until it's manually restored.
# A tiny read through the REST API every 3 days counts as activity. `anon`
# has no grant on drawings (see 0002_drawings_grants.sql), so Postgres itself
# answers "permission denied" (42501) -- that still means the database ran
# the query, which is all that matters here. Only an unreachable project or
# any other response fails the job.

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          body=$(curl -sS -m 30 \
            "$SUPABASE_URL/rest/v1/drawings?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "$body"
          echo "$body" | grep -q '"42501"\|^\['
